[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-eligibility-engine"
version = "0.4.6"
description = "Financial Eligibility Engine v0.4.6 final conversational runtime, working note and Web handoff closure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx2>=2.12,<3",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
eligibility-demo = "eligibility.cli:main"
eligibility-audit = "eligibility.audit.__main__:main"
eligibility-web = "eligibility.web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"eligibility.web" = ["static/*.html", "static/*.css", "static/*.js"]
"eligibility.catalog" = ["data/product_catalog/*.md", "data/product_catalog/*.csv", "data/product_catalog/products/*.json", "data/product_catalog/manifests/*.json"]
