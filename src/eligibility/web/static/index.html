<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>딱금리 · 금융상품 AI 추천</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260901-13" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">%</div>
        <div>
          <div class="brand-name">딱금리</div>
          <div class="brand-sub">복잡한 비교 없이, 내 조건에 딱 맞는 금융상품을 쉽게 찾아드려요</div>
        </div>
      </div>
      <div class="topbar-legend legend" aria-label="상품 정보 확인 기준">
        <span><i class="legend-dot verified"></i>금융데이터 확인</span>
        <span><i class="legend-dot plan"></i>계획 기준</span>
        <span><i class="legend-dot unknown"></i>가입 시 기관 확인</span>
      </div>
      <div class="runtime-pills hidden" aria-hidden="true">
        <span class="pill" id="llm-pill">LLM 확인 중</span>
        <span class="pill" id="product-count-pill">상품 불러오는 중</span>
      </div>
    </header>

    <main class="workspace">
      <section class="chat-pane" id="chat-pane" aria-label="금융상품 검색 대화">
        <div class="pane-header">
          <div class="search-progress-track" id="search-progress" role="progressbar" aria-label="조건 확인 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="search-progress-fill" id="search-progress-fill"></div>
          </div>
          <section class="understood-card header-understood-card" id="understood-card">
            <div class="section-title-row">
              <div class="understood-actions">
                <button class="new-chat-button" id="new-chat-button" type="button" aria-label="대화를 처음부터 시작" title="대화를 처음부터 시작합니다"><span class="new-chat-icon" aria-hidden="true">↺</span></button>
                <button class="understood-toggle" id="understood-toggle" type="button" aria-expanded="false" aria-controls="understood-content">
                  <span id="understood-toggle-label">AI는 잘 이해했나?</span><span class="toggle-chevron" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div class="understood-content" id="understood-content" hidden>
              <div class="section-caption" id="state-caption">조건이 다르면 각 항목의 수정 버튼을 눌러 알려주세요.</div>
              <div class="state-chips" id="state-chips">
                <span class="empty-chip">대화를 시작하면 여기에 검색 기준이 표시됩니다.</span>
              </div>
            </div>
          </section>
        </div>

        <div class="chat-scroll" id="chat-scroll">
          <div id="messages"></div>
        </div>

        <div class="answer-examples-dock" id="answer-examples-dock" hidden></div>
        <form class="composer" id="composer">
          <textarea id="message-input" rows="1" placeholder="AI에게 질문하세요!"></textarea>
          <button type="submit" class="send-button" id="send-button" aria-label="메시지 보내기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.7 4.4 21 12 3.7 19.6l1.7-6.1 8.4-1.5-8.4-1.5-1.7-6.1Z" /></svg>
          </button>
        </form>
      </section>

      <div
        class="pane-resizer"
        id="pane-resizer"
        role="separator"
        aria-label="채팅창과 상품 목록 너비 조절"
        aria-controls="chat-pane results-pane"
        aria-orientation="vertical"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="24"
        tabindex="0"
        title="드래그하여 너비 조절 · 더블클릭하여 초기화"
      ><span aria-hidden="true"></span></div>

      <section class="results-pane" id="results-pane" aria-label="맞춤 상품 추천">
        <div class="results-header">
          <div class="results-title-row">
            <div class="results-title">
              <h2>이런 상품들을 추천해드려요!</h2>
            </div>
            <div class="product-search" id="product-search">
              <label class="product-search-field">
                <span class="visually-hidden">상품 검색</span>
                <input id="product-search-input" type="search" placeholder="상품명 검색" autocomplete="off" />
              </label>
              <button class="product-search-toggle" id="product-search-toggle" type="button" aria-label="상품 검색창 열기" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
              </button>
            </div>
          </div>
          <div class="recommendation-toolbar">
            <div class="toolbar-control-group filter-control-group">
              <div class="product-family-filter" id="product-family-filter" role="group" aria-label="상품군 필터">
                <button type="button" data-product-type="TIME_DEPOSIT" aria-pressed="false">#예금</button>
                <button type="button" data-product-type="INSTALLMENT_SAVINGS" aria-pressed="false">#적금</button>
                <button type="button" data-product-type="PARKING_ACCOUNT" aria-pressed="false">#파킹통장</button>
                <button type="button" data-product-type="CMA" aria-pressed="false">#CMA</button>
              </div>
              <div class="institution-quick-filters" role="group" aria-label="금융기관 필터">
                <button class="first-sector-filter" id="first-sector-filter" type="button" data-institution-sector="BANK" aria-pressed="false">#1금융권</button>
                <button class="first-sector-filter" id="savings-bank-filter" type="button" data-institution-sector="SAVINGS_BANK" aria-pressed="false">#저축은행</button>
                <button class="institution-picker-button" id="institution-picker-button" type="button" aria-haspopup="dialog" aria-expanded="false">
                  <span>은행 선택</span><em id="institution-selection-count" hidden></em>
                </button>
              </div>
            </div>
            <div class="selected-institution-strip" id="selected-institution-strip" aria-label="선택한 금융기관" hidden></div>
          </div>
        </div>

        <section class="recommendation-section">
          <div class="recommendations" id="recommendations">
            <div class="empty-results">
              <div class="empty-illustration">₩</div>
              <h3>검색 조건을 알려주세요</h3>
              <p>광고 최고금리가 아니라, 실제 납입계획과 받을 수 있는 우대조건을 기준으로 비교합니다.</p>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div class="institution-picker-backdrop hidden" id="institution-picker-backdrop" role="presentation"></div>
  <section class="institution-picker-modal hidden" id="institution-picker-modal" role="dialog" aria-modal="true" aria-labelledby="institution-picker-title">
    <header class="institution-picker-header">
      <div>
        <h2 id="institution-picker-title">금융기관 선택</h2>
        <p>여러 금융기관을 함께 선택할 수 있어요.</p>
      </div>
      <button class="institution-picker-close" id="institution-picker-close" type="button" aria-label="금융기관 선택 닫기">×</button>
    </header>
    <div class="institution-picker-body" id="institution-picker-body"></div>
    <footer class="institution-picker-footer">
      <button class="institution-picker-clear" id="institution-picker-clear" type="button">선택 해제</button>
      <button class="institution-picker-apply" id="institution-picker-apply" type="button">선택 완료</button>
    </footer>
  </section>

  <div class="detail-backdrop hidden" id="detail-backdrop" role="presentation"></div>
  <aside class="detail-drawer hidden" id="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="detail-product-name">
    <div class="detail-header">
      <a class="detail-product-link" id="detail-product-link" target="_blank" rel="noopener" aria-disabled="true">
        <span class="detail-logo-wrap" aria-hidden="true">
          <img class="detail-institution-logo" id="detail-institution-logo" alt="" hidden />
          <span class="detail-logo-placeholder" id="detail-logo-placeholder">금융</span>
        </span>
        <div class="detail-product-copy">
          <div class="detail-institution" id="detail-institution"></div>
          <div class="detail-product-title-row">
            <h2 id="detail-product-name">상품 상세</h2>
          </div>
        </div>
        <span class="detail-link-caption" id="detail-link-caption">홈페이지로 이동</span>
        <span class="detail-external-icon" aria-hidden="true">↗</span>
      </a>
      <button class="icon-button" id="detail-close" aria-label="상세 닫기">×</button>
    </div>
    <div class="detail-scroll" id="detail-content"></div>
  </aside>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <script type="module" src="/static/app.js?v=20260901-25"></script>
</body>
</html>
