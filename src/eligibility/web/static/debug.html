<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>내 금리 찾기 · 내부 흐름 보기</title>
  <link rel="stylesheet" href="/static/debug.css?v=20260824-13" />
</head>
<body>
  <header class="debug-topbar">
    <section class="summary-strip" id="summary-strip" aria-label="선택한 시점의 검색 요약"></section>
    <div class="top-actions">
      <span id="connection-pill" class="status-pill">연결 확인 중</span>
      <a href="/" target="_blank" class="button-link">제출 화면 열기 ↗</a>
    </div>
  </header>

  <main class="debug-layout">
    <aside class="session-sidebar">
      <div class="sidebar-title">
        <h2>SearchSession</h2>
        <button id="refresh-button" type="button">새로고침</button>
      </div>
      <p class="muted">진행 중인 세션과 디스크에 영구 저장된 읽기 전용 기록을 함께 표시합니다.</p>
      <div id="session-list" class="session-list"></div>
    </aside>

    <section class="debug-main">
      <div id="empty-state" class="empty-state">
        <strong>아직 확인할 SearchSession이 없습니다.</strong>
        <span>제출 화면에서 검색을 시작한 뒤 이 화면으로 돌아오세요.</span>
      </div>

      <div id="session-content" class="hidden">
        <section id="core-overview" class="core-overview">
          <div id="core-status-cards" class="core-status-grid"></div>
          <section class="core-turn-section">
            <div class="section-heading">
              <div><span class="section-kicker">실제 처리 과정 <button type="button" id="core-session-id" class="core-session-id" title="SearchSession ID 복사"></button></span><h2>대화 Turn</h2></div>
              <span id="core-turn-count" class="count-badge"></span>
            </div>
            <div class="two-column core-turn-columns">
              <div id="core-turn-list" class="request-list"></div>
              <div id="core-turn-detail" class="request-detail core-turn-detail"></div>
            </div>
          </section>
        </section>

        <details id="technical-details" class="technical-details">
          <summary>
            <span><strong>상세 보기</strong><small>실제 Prompt · JSON Schema · 원문 JSON · 전체 Audit</small></span>
            <span class="details-action">펼치기</span>
          </summary>
          <div class="technical-details-body">
            <div class="notice neutral">아래 영역은 개발·원인 분석용 원문입니다. 기본 화면은 위 카드만으로 이해할 수 있도록 구성했습니다.</div>
            <nav class="view-tabs" aria-label="상세 디버그 보기 선택">
              <button class="active" data-view="turns">Turn 원문</button>
              <button data-view="state">멀티턴 상태 JSON</button>
              <button data-view="engine">Engine 입력·출력 JSON</button>
              <button data-view="audit">전체 Audit</button>
            </nav>

            <section id="view-turns" class="view-panel">
              <div class="two-column">
                <div>
                  <div class="section-heading">
                    <h2>대화 Turn과 HTTP 요청</h2>
                    <span id="request-count" class="count-badge"></span>
                  </div>
                  <div id="request-list" class="request-list"></div>
                </div>
                <div id="request-detail" class="request-detail"></div>
              </div>
            </section>

            <section id="view-state" class="view-panel hidden"></section>
            <section id="view-engine" class="view-panel hidden"></section>
            <section id="view-audit" class="view-panel hidden"></section>
          </div>
        </details>
      </div>
    </section>
  </main>

  <script type="module" src="/static/debug.js?v=20260824-13"></script>
</body>
</html>
